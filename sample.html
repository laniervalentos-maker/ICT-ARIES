<!DOCTYPE html>
 <html>
    <head>
        <style>
            body{
                font-family: Arial, sans-serif;
                background-color: black;
            }  
            label{
              
                font-weight: bold;
                margin-bottom: 5px;
                color:yellow;
            }
            form{
                text-align: center;
            }
            nav{
                
                text-align: center;
                padding: 10px;
                background-color: #333;
            }
            a{
                text-decoration: none;
                color: white;
                margin: 0 10px;
            }
            header{
                text-align: center;
                font-size: 24px;
                margin-top: 20px;
                color: yellow;
            }
            p{
                text-align: center;
                font-size: 18px;
                color: yellow;
            }

            
                
            
        </style>

    </head>
    <body>
        <nav>
            <ol>
                <a href="#home">Home</a>
                <a href="#name">Name</a>
                <a href="#email">Email</a>
                <a href="#phone">Phone Number</a>
                <a href="#message">Message</a>
            </ol>
        </nav><br>
        <header>Sample Form</header><br>
        <h1 id="home">Home</h1>
        <p>Welcome to our website! Please fill out the form below to get in touch with us.</p><br>
    
        <form>

    <label for="name">Name:</label><br>
    <input type="text"
           id="name"
           minlength="3"
           maxlength="30"
           required><br><br>

    <label for="email">Email:</label><br>
    <input type="email"
           id="email"
           placeholder="example@gmail.com"
           required><br><br>

    <label for="phone">Phone Number:</label><br>
    <input type="tel"
           id="phone"
           pattern="\+63[0-9]{10}"
           placeholder="+639123456789"
           maxlength="13" 
            pattern="\\+63\\d{10}"
            inputmode="numeric"
           required><br><br>

    <label for="message">Message:</label><br>
    <textarea
        id="message"    
        minlength="10"
        maxlength="500"
        required></textarea><br><br>

    <input type="submit" value="Submit">

</form>

    </body>
 </html>
